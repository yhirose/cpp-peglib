name: CMake

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, macos-latest, windows-latest, windows-2022]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Configure CMake with C++20
      run: cmake -B ${{github.workspace}}/build_20 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_STANDARD=20

    - name: Build with C++20
      run: cmake --build ${{github.workspace}}/build_20 --config ${{env.BUILD_TYPE}} --parallel 4

    - name: Test with C++20
      working-directory: ${{github.workspace}}/build_20
      run: ctest -C ${{env.BUILD_TYPE}}

  # Release builds define NDEBUG, so the jobs above never run peglib's asserts.
  assert:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake with assertions enabled
      run: cmake -B ${{github.workspace}}/build_assert -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2

    - name: Build
      run: cmake --build ${{github.workspace}}/build_assert --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build_assert
      run: ctest --output-on-failure
